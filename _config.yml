title: Tech Perspectives
description: >-
  Essays on AI, software and the shape of technical work, by Cesaire Tobias.
author: Cesaire Tobias
lang: en_US

# The origin the canonical URLs, the sitemap and the feed are built from.
#
# The CNAME file beside this holds the same name. Both are needed: the file is
# what tells GitHub Pages which host to serve, and this is what every canonical
# tag, sitemap entry and feed link is built from. With only the file, the site
# would serve on the domain and advertise itself at the old one.
url: https://blog.sheetsolved.com
baseurl: ""

theme: jekyll-theme-minimal
markdown: kramdown

# The articles live in `_posts/`, which is what makes them `site.posts` - and
# `site.posts` is what `jekyll-feed` reads. As root-level pages they published
# a feed with a title, a subtitle and no entries at all, which is the one thing
# a feed cannot be.
#
# `:title` is the filename with its date prefix removed, so this reproduces the
# URLs the articles already had: `/ai-lying-is-lying.html`, not the dated path
# Jekyll would default to. Nothing that links to them breaks.
permalink: /:title.html

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# jekyll-feed writes /feed.xml for everything, and one file per category named
# here. R-bloggers syndicates a feed that carries R content and nothing else,
# so the R category gets its own at /feed/R.xml rather than the site feed being
# offered and rejected.
feed:
  categories:
    - R

# Every article is a page at the root rather than a `_posts` entry, so the
# defaults that would come free from a collection are set here.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      author: Cesaire Tobias

exclude:
  - IDEAS.md
  # README.md is the repo's front page and links to `.md` files, which is right
  # on GitHub and wrong on the built site, where they serve raw markdown.
  # `index.md` is the site's front page and links to the rendered pages. The
  # generator writes both.
  - README.md
  - scripts/
  - .githooks/
  # `_source/` holds the .Rmd the R article is knitted from, by
  # `scripts/render-r-post.R`. The post in `_posts/` is its output. Neither the
  # source nor a stray .Rmd anywhere else should be published: an .Rmd carries
  # front matter of its own, so Jekyll would treat one as a page and serve an
  # unknitted document full of raw knitr chunks.
  - _source/
  - "*.Rmd"
