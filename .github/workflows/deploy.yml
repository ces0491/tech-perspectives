name: Update README and Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      # `index.md` is generated, and `robots.txt` and the front matter in each
      # article all feed the built site, so a change to any of them has to
      # reach Pages. The old filter named `*.md` and `_config.yml` only.
      - "*.md"
      - "_posts/**"
      - "assets/**"
      - "_config.yml"
      - "robots.txt"
      - "CNAME"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Front matter, dates, and descriptions that are present, distinct and
      # the right length. These are the failures that reach the live site
      # quietly: a post Jekyll skips, or a description that falls back to the
      # site's and reads identically on every page in a search result.
      - name: Check the articles
        run: node scripts/validate.js

      # The generator has to run before its output can be trusted, and a
      # syntax error in it currently fails the workflow only after a commit
      # has already been pushed.
      - name: Check the generator runs
        run: node scripts/update-readme.js

      # Jekyll last, because a broken `_config.yml` is the one failure the
      # checks above cannot see. Building here rather than only in the deploy
      # job means it fails before the README commit is pushed.
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

  update-readme:
    name: Auto-update Article Links
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Update README
        run: node scripts/update-readme.js

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet README.md; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes to README.md"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in README.md"
          fi

      - name: Commit README changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "docs: auto-update README with articles list"
          git push

      - name: Summary
        run: |
          if [ "${{ steps.check_changes.outputs.changed }}" == "true" ]; then
            echo "README.md updated with latest article links"
          else
            echo "README.md is already up to date"
          fi

  deploy:
    name: Deploy to GitHub Pages
    needs: [validate, update-readme]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Pull latest changes
        run: git pull origin main

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify-hub:
    name: Rebuild the hub
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The hub reads this feed and caches what it gets for an hour. Firing
      # the hook the moment the deploy job finishes would race the CDN: the
      # hub would fetch the previous feed and hold it for an hour, which is
      # worse than having no hook at all. So wait until the newest post is
      # actually being served before asking anything to rebuild.
      - name: Wait for the feed to carry the newest post
        run: |
          newest=$(ls -1 _posts/*.md | sort | tail -1)
          slug=$(basename "$newest" .md | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}-//')
          host=$(cat CNAME)
          echo "waiting for /$slug.html in https://$host/feed.xml"
          # Downloaded rather than piped into grep. `grep -q` exits on the
          # first match and closes the pipe, so curl reports a write failure
          # on the success path and the log reads like an error.
          for _ in $(seq 1 30); do
            if curl -fsS "https://$host/feed.xml" -o feed.xml; then
              if grep -q "$slug[.]html" feed.xml; then
                echo "feed is current"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::$host/feed.xml did not carry $slug.html within five minutes"
          exit 1

      # An absent secret is a valid state rather than a failure: the hub's
      # one-hour revalidate is what guarantees it does not drift, and this
      # hook only makes the update immediate. A secret that is present and
      # rejected does fail the step, because a hook that has quietly stopped
      # working is the thing worth being told about.
      - name: Trigger the hub rebuild
        env:
          HOOK: ${{ secrets.SHEETSOLVED_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::SHEETSOLVED_DEPLOY_HOOK is not set. The hub will pick this post up within the hour on its own."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null
          echo "hub rebuild requested"
